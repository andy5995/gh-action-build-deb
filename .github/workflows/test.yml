name: Test Action
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: v1-develop
    paths:
    - 'entrypoint.sh'
    - '**Dockerfile'
    - '!**.yml'
    - '!**.md'
    - 'action.yml'
    - '**test.yml'

jobs:
  build-deb:
    strategy:
      fail-fast: true # TODO: change this so it can be an input
      matrix:
        codename: [bookworm, trixie]
        platform: [amd64, arm64, riscv64]
        exclude:
          - codename: bookworm
            platform: riscv64
    runs-on: ubuntu-latest
    env:
      ACTION_DIR: '_action_test'
      # Keep in sync with docker.yml MAJOR_VERSION when cutting a major release.
      MAJOR_VERSION: v1
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        PLATFORM_PAIR="${platform//\//-}"
        echo "PLATFORM_PAIR=${PLATFORM_PAIR}" >> $GITHUB_ENV
        echo "DOCKER_CACHE_DEST=${{ github.workspace }}/.docker/buildx-cache-${{ matrix.codename }}-$PLATFORM_PAIR" >> $GITHUB_ENV

    - name: Checkout rmw
      uses: actions/checkout@v6
      with:
        repository: theimpossibleastronaut/rmw
        ref: v0.9.3

    - name: Copy debian directory
      run: cp -a packaging/debian .

    - uses: actions/checkout@v6
      with:
        path: ${{ env.ACTION_DIR }}
        fetch-depth: 0  # Fetch full history to ensure trunk is available

    - name: Check if Dockerfile or entrypoint.sh has changed
      run: |
        echo "do_build=false" >> $GITHUB_ENV
        if [ "${{ github.ref }}" != "refs/heads/trunk" ]; then
          cd $ACTION_DIR
          git fetch origin trunk --depth=1
          FILES=$(git diff --name-only origin/trunk HEAD)
          echo $FILES
          if echo "$FILES" | grep -qE "^(Dockerfile|entrypoint\.sh)$"; then
            echo "do_build=true" >> $GITHUB_ENV
          fi
        fi

    - name: Cache Docker layers
      if: ${{ env.do_build == 'true' }}
      id: docker-cache
      uses: actions/cache@v5
      with:
        path: ${{ env.DOCKER_CACHE_DEST }}
        key: ${{ runner.os }}-docker-${{ github.ref_name }}-${{ matrix.codename }}-${{ env.PLATFORM_PAIR }}
        restore-keys: |
          ${{ runner.os }}-docker-${{ matrix.codename }}-${{ env.PLATFORM_PAIR }}

    - name: Set up QEMU
      if: ${{ matrix.platform != 'amd64' && env.do_build == 'true' }}
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      if: ${{ env.do_build == 'true' }}
      uses: docker/setup-buildx-action@v4

    - name: Build docker image
      if: ${{ env.do_build == 'true' }}
      run: |
        cd "$ACTION_DIR"
        docker buildx build \
          . \
          --build-arg CODENAME=${{ matrix.codename }} \
          --platform linux/${{ matrix.platform }} \
          -t ghcr.io/${{ github.repository_owner }}/gh-action-build-deb:${{ matrix.codename }}-${{ env.MAJOR_VERSION }} \
          --cache-to=type=local,dest=${{ env.DOCKER_CACHE_DEST }} \
          --cache-from=type=local,src=${{ env.DOCKER_CACHE_DEST }} \
          --load

# Apparently variables aren't allowed with the 'uses' key?
#
# Invalid workflow file: .github/workflows/test.yml#L47
# The workflow is not valid. .github/workflows/test.yml (Line: 47, Col: 13):
# Unrecognized named-value: 'env'. Located at position 1 within expression: env.ACTION_DIR
    - uses: ./_action_test
      with:
        codename: ${{ matrix.codename }}
        args: |
          --no-sign
          --compression=xz
        lintian_check: true
        fail_on_lintian_error: false
        platform: ${{ matrix.platform }}

    - name: Create sha256sum
      run: |
        DEB_FILENAME=$(basename `find output/*deb`)
        echo "DEB_FILENAME=$DEB_FILENAME" >> $GITHUB_ENV
        cd output
        sha256sum "$DEB_FILENAME" > "../$DEB_FILENAME.sha256sum"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DEB_FILENAME }}-${{ matrix.codename }}
        path: |
          output/*.deb
          *deb.sha256sum
        if-no-files-found: error
