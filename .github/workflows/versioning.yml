name: Update version tags

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  update-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Update major version and codename tags
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}"

          # Map each major version to its Debian codename
          case "$MAJOR" in
            v2) CODENAME="trixie" ;;
            *)  CODENAME="" ;;
          esac

          git tag -f "$MAJOR"
          git push origin "refs/tags/$MAJOR" --force

          if [ -n "$CODENAME" ]; then
            git tag -f "$CODENAME"
            git push origin "refs/tags/$CODENAME" --force
          fi
