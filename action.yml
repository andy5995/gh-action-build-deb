name: 'Build Debian package on multiple architectures'
description: 'Build Debian package on multiple architectures'
inputs:
  archive_url:
    description: 'URL of the upstream source release archive'
    required: true
  debian_path:
    description: 'Relative path (within the workspace) to the debian/ packaging directory'
    required: true
  sources:
    description: 'Any extra sources to add to apt'
    required: false
    default: ''
  ppa:
    description: 'An extra PPA to add to apt (no ppa: prefix)'
    required: false
    default: ''
  args:
    description: 'Arguments to pass to dpkg-buildpackage'
    required: false
  codename:
    description: 'Debian codename'
    required: false
    default: 'trixie'
  platform:
    description: 'Target architecture'
    required: false
    default: 'amd64'
  lintian_check:
    description: 'Run lintian on the built package'
    required: false
    default: 'false'
  fail_on_lintian_error:
    description: 'Fail the action if lintian reports errors (only applies when lintian_check is true)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup QEMU
      if: ${{ !contains(inputs.platform, 'amd64') }}
      uses: docker/setup-qemu-action@v4
    - name: Build Debian package
      run: |
        CODENAME="${{ inputs.codename }}"
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          --platform linux/${{ inputs.platform }} \
          -e INPUT_ARCHIVE_URL="${{ inputs.archive_url }}" \
          -e INPUT_DEBIAN_PATH="${{ inputs.debian_path }}" \
          -e INPUT_CODENAME="$CODENAME" \
          -e INPUT_SOURCES="${{ inputs.sources }}" \
          -e INPUT_PPA="${{ inputs.ppa }}" \
          -e INPUT_ARGS="${{ inputs.args }}" \
          -e INPUT_LINTIAN_CHECK="${{ inputs.lintian_check }}" \
          -e INPUT_FAIL_ON_LINTIAN_ERROR="${{ inputs.fail_on_lintian_error }}" \
          ghcr.io/andy5995/gh-action-build-deb:${CODENAME}-v2
      shell: bash

branding:
  icon: 'package'
  color: 'gray-dark'
