name: 'Build Debian package on multiple architectures'
description: 'Build Debian package on multiple architectures'
inputs:
  sources:
    description: 'Any extra sources to add to apt'
    required: false
    default: ''
  ppa:
    description: 'An extra PPA to add to apt (no ppa: prefix)'
    required: false
    default: ''
  args:
    description: 'Arguments to pass to dpkg-buildpackage'
    required: false
  platform:
    description: 'Target architecture'
    required: false
    default: 'amd64'

runs:
  using: 'composite'
  steps:
    - name: Setup QEMU
      if: ${{ !contains(inputs.platform, 'amd64') }}
      uses: docker/setup-qemu-action@v3
    - name: Build Debian package
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          --platform linux/${{ inputs.platform }} \
          -e INPUT_SOURCES="${{ inputs.sources }}" \
          -e INPUT_PPA="${{ inputs.ppa }}" \
          -e INPUT_ARGS="${{ inputs.args }}" \
          ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}:pr-{1}', github.repository, github.event.pull_request.number) || format('ghcr.io/{0}:bookworm', github.repository) }}
      shell: bash

branding:
  icon: 'package'
  color: 'gray-dark'
